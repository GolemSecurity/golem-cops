version: "1.0"
category: code
scanner: secret

rules:
  - id: GOLEM-S001
    name: Hardcoded Password
    pattern: '(?i)(password|passwd|pwd)\s*=\s*["''][^"'']{3,}["'']'
    severity: HIGH
    description: Hardcoded password detected in source code.
    remediation: Use environment variables or a secrets manager instead.
    tags: [secret, password, credential]

  - id: GOLEM-S002
    name: Hardcoded API Key
    pattern: '(?i)(api_key|apikey|api-key)\s*=\s*["''][^"'']{8,}["'']'
    severity: HIGH
    description: Hardcoded API key detected in source code.
    remediation: Store API keys in environment variables or a vault.
    tags: [secret, api-key, credential]

  - id: GOLEM-S003
    name: AWS Access Key
    pattern: 'AKIA[0-9A-Z]{16}'
    severity: CRITICAL
    description: AWS Access Key ID detected in source code.
    remediation: Rotate the key immediately and use IAM roles instead.
    tags: [secret, aws, cloud, credential]

  - id: GOLEM-S004
    name: Generic Secret or Token
    pattern: '(?i)(secret|token)\s*=\s*["''][^"'']{8,}["'']'
    severity: MEDIUM
    description: Generic secret or token detected in source code.
    remediation: Move secrets to environment variables or a secrets manager.
    tags: [secret, token, credential]

  - id: GOLEM-S005
    name: Private Key Header
    pattern: '-----BEGIN (RSA |EC )?PRIVATE KEY-----'
    severity: CRITICAL
    description: Private key detected in source code.
    remediation: Remove immediately. Never commit private keys to source control.
    tags: [secret, private-key, cryptography]

  - id: GOLEM-S006
    name: GitHub Personal Access Token
    pattern: 'ghp_[a-zA-Z0-9]{36}'
    severity: CRITICAL
    description: GitHub Personal Access Token detected.
    remediation: Revoke the token immediately on GitHub and remove from code.
    tags: [secret, github, token, credential]

  - id: GOLEM-S007
    name: Slack Token
    pattern: 'xox[baprs]-[0-9a-zA-Z]{10,48}'
    severity: HIGH
    description: Slack token detected in source code.
    remediation: Revoke the token in Slack and use environment variables.
    tags: [secret, slack, token, credential]

  - id: GOLEM-S008
    name: Database Connection String
    pattern: '(?i)(mongodb|mysql|postgres|redis):\/\/[^\s"'']+'
    severity: HIGH
    description: Database connection string with credentials detected.
    remediation: Use environment variables for database connection strings.
    tags: [secret, database, credential]